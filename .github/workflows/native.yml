name: Native platform packages

on:
  workflow_dispatch:
  push:
    branches: ['hour17-native-platforms']
    paths: ['src/**', 'tests/**', 'scripts/**', 'package*.json', '.github/workflows/native.yml', 'vite.config.ts', 'tsconfig.json']

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    concurrency:
      group: native-packages-${{ github.ref }}-${{ matrix.artifact }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: --win nsis --x64
            executable: release/win-unpacked/Astra.exe
            artifact: windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            target: --mac dmg zip --arm64 -c.mac.identity=-
            executable: release/mac-arm64/Astra.app/Contents/MacOS/Astra
            artifact: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            target: --mac dmg zip --x64 -c.mac.identity=-
            executable: release/mac/Astra.app/Contents/MacOS/Astra
            artifact: macos-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify source on the native desktop
        env:
          DEBUG: pw:browser
        run: npm run verify
      - name: Build native installable artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Exercise packaged Chromium and isolated profile
        run: node scripts/smoke-package.mjs '${{ matrix.executable }}'
      - name: Keep verified packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astra-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failures-${{ matrix.artifact }}-${{ github.sha }}
          path: test-results/
          retention-days: 7
