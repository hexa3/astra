# SPDX-License-Identifier: MPL-2.0
name: Verify and publish reproducible release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing semantic version tag to rebuild and release
        required: true
        type: string
      publish:
        description: Publish only after the two builds match
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Release build ${{ matrix.copy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - run: npm run package:reproducible:container
      - working-directory: release/reproduced
        run: sha256sum --check *.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.copy }}-${{ inputs.release_tag }}
          path: release/reproduced/
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Block on any byte difference
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-a-${{ inputs.release_tag }}
          path: verify/a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: release-b-${{ inputs.release_tag }}
          path: verify/b
      - run: |
          for archive in verify/a/*.tar.gz; do
            npm run verify:reproducible -- "$archive" "verify/b/$(basename "$archive")"
          done
          for manifest in verify/a/*.sha256; do
            cmp "$manifest" "verify/b/$(basename "$manifest")"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-${{ inputs.release_tag }}
          path: verify/a/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified bytes
    if: inputs.publish
    needs: compare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-tags: true
      - name: Validate release target
        run: |
          printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: verified-${{ inputs.release_tag }}
          path: verified
      - name: Publish once and verify the public bytes
        run: |
          RELEASE_NOTES="docs/releases/${RELEASE_TAG}.md"
          test -f "$RELEASE_NOTES"
          RELEASE_STATE=new
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true; then
              RELEASE_STATE=draft
            else
              RELEASE_STATE=published
            fi
          fi
          if test "$RELEASE_STATE" = draft; then
            gh release edit "$RELEASE_TAG" --notes-file "$RELEASE_NOTES"
          elif test "$RELEASE_STATE" = new; then
            gh release create "$RELEASE_TAG" --draft --notes-file "$RELEASE_NOTES" --title "Astra ${RELEASE_TAG#v}"
          fi
          if test "$RELEASE_STATE" != published; then
            gh release upload "$RELEASE_TAG" verified/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          fi
          mkdir published
          gh release download "$RELEASE_TAG" --pattern '*-reproducible.tar.gz' --pattern '*.sha256' --dir published
          for archive in verified/*.tar.gz; do
            npm run verify:reproducible -- "$archive" "published/$(basename "$archive")"
          done
          for manifest in verified/*.sha256; do
            cmp "$manifest" "published/$(basename "$manifest")"
          done
