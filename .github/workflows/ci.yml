name: Browser checks

on:
  push:
    branches: [main, 'hour*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux sandboxed browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install desktop test libraries
        run: npx playwright install-deps chromium
      - name: Allow Chromium user namespaces in this disposable runner
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Verify production build and native browser behavior
        run: xvfb-run -a npm run verify
      - name: Check production dependencies
        run: npm audit --omit=dev
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-test-failures
          path: test-results/
          retention-days: 7
